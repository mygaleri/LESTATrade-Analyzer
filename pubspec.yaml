name: forex_analyzer
description: Real-time Forex Analysis Tool dengan Signal Generator & Sentiment Analysis
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  
  # HTTP & WebSocket
  dio: ^5.3.0
  web_socket_channel: ^2.4.0
  
  # Charts & Visualization
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^23.1.36
  syncfusion_flutter_gauges: ^23.1.36
  
  # Data Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  
  # Date & Time
  intl: ^0.19.0
  timezone: ^0.9.2
  
  # Notifications
  flutter_local_notifications: ^14.1.0
  
  # Utilities
  equatable: ^2.0.5
  json_serializable: ^6.7.1
  freezed_annotation: ^2.4.1
  
  # UI Enhancements
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Testing
  mockito: ^5.4.0
  test: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  json_serializable: ^6.7.1
  freezed: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600